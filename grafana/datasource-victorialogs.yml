# Drop into onprem-metrics/grafana/provisioning/datasources/. The plugin
# comes with the image built by grafana/build.sh (pinned base digest and
# plugin sha256), not from GF_INSTALL_PLUGINS at container start.
apiVersion: 1
datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: false
    jsonData:
      maxLines: 1000
