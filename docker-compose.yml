# Log store for the collector VM. Joins the onprem-metrics compose network
# so Grafana there reaches it as victorialogs:9428. Image pinned the Day 3
# way (multi-arch index digest, checked 2026-10-04).
services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=90d                       # hot copy, same window as Prometheus
      - -retention.maxDiskSpaceUsageBytes=12GiB    # 32 GiB VM; archive lives on the NAS
      - -httpListenAddr=:9428
      # journald from DGX Spark and PVE nodes (systemd-journal-upload)
      - -journald.streamFields=_HOSTNAME,_SYSTEMD_UNIT
      - -journald.ignoreFields=_CAP_EFFECTIVE,_SYSTEMD_INVOCATION_ID,_SOURCE_MONOTONIC_TIMESTAMP,__MONOTONIC_TIMESTAMP,_BOOT_ID
      - -journald.useRemoteIP=true
      # syslog from QuLog Center Log Sender (and anything else that speaks RFC 3164/5424)
      - -syslog.listenAddr.tcp=:514
      - -syslog.listenAddr.udp=:514
      - -syslog.streamFields.tcp=["hostname","app_name"]
      - -syslog.streamFields.udp=["hostname","app_name"]
      - -syslog.timezone=Asia/Taipei              # RFC 3164 has no zone; QuLog sends local time (待確認)
      - -loggerFormat=json
    ports:
      # reachable from the nodes and the NAS. ufw does not see published
      # ports; collector/docker-user-allowlist.sh limits who gets through
      - "0.0.0.0:9428:9428"   # IPv4 only: a [::] listener is served by docker-proxy
                                 # through INPUT and would skip DOCKER-USER
      - "0.0.0.0:514:514/tcp"
      - "0.0.0.0:514:514/udp"
    volumes:
      - victorialogs-data:/victoria-logs-data
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 1g}
    # no healthcheck: the image is FROM scratch (no shell, no wget); health
    # is watched from outside, Prometheus scrapes victorialogs:9428/metrics

volumes:
  victorialogs-data:

networks:
  default:
    name: onprem-metrics_default
    external: true
